<header class="topbar">
  <div class="topbar-inner">
    <div class="search-wrapper">
      <span class="material-symbols-outlined search-icon">search</span>
      <input
        class="search-input"
        type="text"
        [ngModel]="searchQuery"
        (ngModelChange)="onSearchChange($event)"
        [placeholder]="i18n.t('search')"
      />
      <div class="search-dropdown" *ngIf="results.length > 0">
        <button class="search-item" type="button" *ngFor="let r of results" (click)="selectLocation(r)">
          <span class="material-symbols-outlined">location_on</span>
          <span class="search-item-text">
            <span style="font-weight:600">{{ r.name }}</span>
            <span class="text-muted" style="margin-left:6px">{{ r.region ? (r.region + ', ') : '' }}{{ r.country }}</span>
          </span>
        </button>
      </div>
    </div>

    <div class="topbar-actions">
      <!-- Language toggle -->
      <button class="btn-icon" (click)="i18n.toggleLang()" title="Toggle language">
        <span class="material-symbols-outlined">translate</span>
      </button>

      <!-- Theme toggle -->
      <button class="btn-icon" (click)="theme.toggleTheme()" title="Toggle theme">
        <span class="material-symbols-outlined">{{ theme.isDark ? 'light_mode' : 'dark_mode' }}</span>
      </button>

      <!-- Notifications -->
      <button class="btn-icon notif-btn">
        <span class="material-symbols-outlined">notifications</span>
        <span class="notif-dot"></span>
      </button>

      <!-- User avatar -->
      <div class="user-avatar-sm" routerLink="/settings">
        <span class="material-symbols-outlined icon-fill">account_circle</span>
      </div>
    </div>
  </div>
</header>
